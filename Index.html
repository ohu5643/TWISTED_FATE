<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>트페 카드 뽑기</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #2c3e50;
      font-family: sans-serif;
    }
    .card-title {
      color: #f1c40f;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .image-container {
      margin-bottom: 30px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    img {
      width: 200px; 
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    .button-container {
      display: flex;
      gap: 15px;
    }
    button {
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    #startBtn {
      background-color: #27ae60;
    }
    #startBtn:hover {
      background-color: #2ecc71;
    }
    #resetBtn {
      background-color: #c0392b;
    }
    #resetBtn:hover {
      background-color: #e74c3c;
    }
  </style>
</head>
<body>

  <!-- 트페 텍스트 -->
  <div class="card-title">트페</div>

  <div class="image-container">
    <!-- 첫 번째 이미지 (기본값) -->
    <img id="cardImage" src="images/1000014946.webp" alt="Card Image">
  </div>

  <div class="button-container">
    <button id="startBtn">시작</button>
    <button id="resetBtn">초기화</button>
  </div>

  <script>
    // GitHub Repository에 업로드된 로컬 이미지 경로 참조
    const images = [
      "images/1000014946.webp", // 1번째: 파란색 카드
      "images/1000014948.webp", // 2번째: 노란색 카드
      "images/1000014947.webp"  // 3번째: 빨간색 카드
    ];
    
    let currentIndex = 0;
    let intervalId = null; 
    const imgElement = document.getElementById("cardImage");
    const startBtn = document.getElementById("startBtn");
    const resetBtn = document.getElementById("resetBtn");

    // 시작 버튼 (0.5초 간격)
    startBtn.addEventListener("click", () => {
      if (intervalId !== null) return; 
      
      intervalId = setInterval(() => {
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];
      }, 500); 
    });

    // 초기화 버튼
    resetBtn.addEventListener("click", () => {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
      currentIndex = 0;
      imgElement.src = images[0];
    });
  </script>
</body>
</html>
